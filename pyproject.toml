[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[project]
name = "imgread_benchmark"
version = "0.3.2.dev2"
description = "benchmark for read images."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
authors = [{ name = "Yasyrev Andrei", email = "a.yasyrev@gmail.com" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "argparsecfg",
    "benchmark_utils",
    "numpy",
    "pillow",
    "requests>=2.32.5",
    "rich",
]

[project.urls]
Homepage = "https://github.com/ayasyrev/imgread_benchmark"

[project.scripts]
imgread_benchmark = "imgread_benchmark.cli:main"

[project.optional-dependencies]
dataloader = ["torch==2.10.0", "torchvision==0.25.0", "opencv-python-headless==4.13.0.90"]
monitor = ["psutil>=7.2,<8"]
imgread = ["imgread>=0.2.0"]
dev = [
    "black",
    "black[jupyter]",
    "coverage[toml]",
    "flake8",
    "isort",
    "mypy",
    "nbmetaclean",
    "pre-commit",
    "ruff",
    "torchvision",
]
test = [
    "pytest",
    "pytest-cov",
]
img_libs = [
    "imgread>=0.2.0",
    "imageio",
    "jpeg4py",
    "kornia",
    "kornia_rs",
    "opencv-python-headless",
    "scikit-image",
    "ajpegli",
    "imagecodecs",
    "simplejpeg",
    "turbojpeg",
]

[tool.imgread.conda-deps]
packages = [
    "accimage",
    "imread",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Preserve the rules used by the Ruff 0.14 pre-commit hook across releases.
select = ["E4", "E7", "E9", "F"]
